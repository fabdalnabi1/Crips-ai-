<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#0b0b10"><title>Crips AI | Import verification</title>
<style>
:root{font:16px system-ui,-apple-system,sans-serif;color-scheme:dark;background:#0b0b10;color:#f5f5fa}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:24px 18px 50px}header{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand,a{color:#e4b75b}.brand{font-size:24px;font-weight:900}h1{font-size:clamp(26px,6vw,40px);margin-top:36px}.panel,.clip{background:#17171e;border:1px solid #3b3b46;border-radius:18px;padding:20px;margin-top:20px}p{line-height:1.9;color:#c3c1ce}.note{border-inline-start:3px solid #b38e48;padding:12px;background:#211e18;color:#e1d1af}label{display:block;margin-bottom:10px;font-weight:700}input,button{font:inherit;width:100%;padding:15px;border-radius:12px;min-height:48px}input{background:#0c0c12;border:1px solid #555;color:white}button{background:#e4b75b;color:#17120a;border:0;cursor:pointer;margin-top:14px;font-weight:750}button:disabled{opacity:.6;cursor:wait}:focus-visible{outline:3px solid #e4b75b;outline-offset:3px}#status{white-space:pre-line;overflow-wrap:anywhere;line-height:1.8;margin-top:18px}#status.error{color:#ffc9c9}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}.clip{margin-top:0;min-width:0}.clip h2{font-size:18px;overflow-wrap:anywhere}.clip video{width:100%;max-height:430px;background:black;margin-top:12px}.save{display:block;text-align:center;padding:14px;margin-top:10px;border:1px solid #8e723a;border-radius:10px}small{color:#b0aaba}footer{margin-top:32px;text-align:center;color:#9a94a4;font-size:12px}[hidden]{display:none!important}@media(max-width:450px){header{align-items:flex-start;flex-direction:column}main{padding:18px 14px}.panel{padding:18px}}
</style></head>
<body><main><header><span class="brand" dir="ltr">CRIPS AI</span><a href="./" id="home"></a></header><h1 id="heading"></h1><p class="note" id="scope"></p><section class="panel"><form id="form"><label for="key" id="keyLabel"></label><input id="key" type="password" autocomplete="off" required dir="ltr"><button id="load" type="submit"></button></form><div id="status" role="status" aria-live="polite"></div></section><p id="attribution" dir="ltr" hidden></p><div id="cards"></div><footer>Crips AI / FluxClip MIT - 2026.11.17<br><a href="https://studio.blender.org/projects/coffee-run/pages/licensing/" target="_blank" rel="noopener noreferrer">Coffee Run: CC BY 4.0 - Blender Foundation</a><br>Vertical excerpts edited by Crips AI. No endorsement.</footer></main>
<script>
'use strict';
const API='https://crips-ai-processing.onrender.com';
const T={
home:'الموقع الرئيسي',heading:'نتيجة تجربة الاستيراد',scope:'اختبار لفيديو واحد مجهز مسبقاً. ليس حلاً لكل روابط YouTube أو قيود العمر.',key:'مفتاح الدخول',load:'عرض نتيجة الاختبار',loading:'جاري الفحص...',running:'المعالجة مستمرة.',passed:'نجح اختبار الاستيراد والقص لهذا الفيديو.',failed:'لم ينجح الاختبار.',notrun:'لا توجد نتيجة اختبار متاحة.',auth:'مفتاح الدخول غير صحيح.',network:'تعذر الاتصال بالسيرفر.',expired:'ملفات التجربة غير متاحة الآن.',clip:'كليب',preview:'معاينة وتنزيل MP4',save:'حفظ MP4',badfile:'تعذر التحقق من ملف الفيديو.'
};
const $=id=>document.getElementById(id);
for(const [id,text] of [['home',T.home],['heading',T.heading],['scope',T.scope],['keyLabel',T.key],['load',T.load]])$(id).textContent=text;
let epoch=0,timer=null;const blobs=[],seen=new Set();
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
function key(){const value=$('key').value.trim();if(!value)throw Error(T.auth);return value}
function clear(){++epoch;clearTimeout(timer);for(const b of blobs)URL.revokeObjectURL(b);blobs.length=0;seen.clear();$('cards').replaceChildren();$('attribution').hidden=true}
async function fetchResponse(path){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),90000);try{const r=await fetch(API+path,{headers:{'X-Access-Key':key()},signal:controller.signal});if(!r.ok)throw Error(r.status===401?T.auth:r.status===404?T.expired:T.network);return r}finally{clearTimeout(timeout)}}
function safePath(raw){if(typeof raw!=='string'||!raw.startsWith('/files/'))throw Error(T.badfile);const u=new URL(raw,API);if(u.origin!==API||!u.pathname.startsWith('/files/'))throw Error(T.badfile);return u.pathname+u.search}
function addClips(project,run){for(const [i,c]of (project.clips||[]).entries()){if(c.status!=='ready'||!c.url||seen.has(c.id))continue;seen.add(c.id);const card=document.createElement('article');card.className='clip';const h=document.createElement('h2');h.textContent=T.clip+' '+(i+1);const small=document.createElement('small');small.textContent=Number(c.duration||c.end-c.start).toFixed(1)+' s';const b=document.createElement('button');b.type='button';b.textContent=T.preview;card.append(h,small,b);$('cards').append(card);b.onclick=async()=>{b.disabled=true;try{const response=await fetchResponse(safePath(c.url));const blob=await response.blob();if(run!==epoch)return;const bytes=await blob.slice(0,64).arrayBuffer();if(!new TextDecoder().decode(bytes).includes('ftyp'))throw Error(T.badfile);const url=URL.createObjectURL(blob);blobs.push(url);const v=document.createElement('video');v.controls=true;v.playsInline=true;v.preload='metadata';v.src=url;const a=document.createElement('a');a.href=url;a.download='crips-coffee-run-'+(i+1)+'.mp4';a.className='save';a.textContent=T.save;card.append(v,a);b.remove()}catch(err){status(err.message||T.network,true);b.disabled=false}}}}
async function poll(run){if(run!==epoch)return;try{const proof=await (await fetchResponse('/api/imported-check')).json();if(run!==epoch)return;const pid=proof.project_id;if(pid){const p=await (await fetchResponse('/api/projects/'+encodeURIComponent(pid))).json();if(run!==epoch)return;addClips(p,run);const pct=Math.round(Math.max(0,Math.min(1,Number(p.progress)||0))*100);status(proof.state==='passed'?T.passed+' '+seen.size+' '+T.clip:T.running+' '+pct+'%')}
if(proof.attribution){$('attribution').textContent=proof.attribution;$('attribution').hidden=false}
if(proof.state==='passed'){if(!seen.size)throw Error(T.expired);$('load').disabled=false;return}
if(proof.state==='failed'){status(T.failed+' '+String(proof.code||''),true);$('load').disabled=false;return}
if(proof.state==='not_run'){status(T.notrun);$('load').disabled=false;return}
status($('status').textContent||T.running);timer=setTimeout(()=>poll(run),5000)
}catch(err){if(run===epoch){status(err.message||T.network,true);$('load').disabled=false}}}
$('form').onsubmit=e=>{e.preventDefault();clear();$('load').disabled=true;status(T.loading);poll(epoch)};
window.addEventListener('pagehide',()=>{clearTimeout(timer);for(const b of blobs)URL.revokeObjectURL(b)});
</script></body></html>
