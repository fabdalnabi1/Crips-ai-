<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0d10"><meta name="referrer" content="no-referrer">
<title>Crips AI | Gaming Shorts</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#0b0b10;color:#f7f7fa}*{box-sizing:border-box}body{margin:0}main{max-width:800px;margin:auto;padding:24px 18px 48px}header{display:flex;gap:12px;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:900;letter-spacing:1px;color:#e4b75b}.badge{font-size:12px;padding:8px 12px;border:1px solid #4e432e;border-radius:30px;color:#e4c98e}h1{font-size:clamp(30px,6vw,48px);line-height:1.3;margin:40px 0 12px}h1 span{color:#e4b75b}p{color:#b9b9c4;line-height:1.8}.panel{background:#17171e;border:1px solid #33333b;border-radius:20px;padding:23px;margin-top:24px}label{display:block;margin:14px 0 8px;font-weight:650}input,select,button{font:inherit;width:100%;padding:14px;border-radius:11px;min-height:48px}input,select{background:#101016;color:#fff;border:1px solid #55545f}input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #e4b75b;outline-offset:3px}button{background:#e4b75b;color:#17120a;border:0;font-weight:750;cursor:pointer}button.secondary{background:#24242e;color:#e7d3aa;border:1px solid #4a4235}button:disabled{opacity:.6;cursor:not-allowed}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.main-btn{margin-top:22px}.hint{font-size:13px;color:#a7a7b5;margin:6px 0 12px}.notice{border-inline-start:3px solid #b38e48;padding:10px 14px;background:#211e18;color:#e1d1af;font-size:14px}.status{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:#111117;border-radius:12px;margin-top:18px;line-height:1.7;color:#ead7ad}.status.error{border:1px solid #9a5555;color:#ffc9c9}progress{width:100%;height:14px;accent-color:#e4b75b;margin-top:14px}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px;margin-top:22px}.clip{background:#17171e;border:1px solid #3b3b46;border-radius:16px;padding:16px}.clip h3{line-height:1.5;font-size:17px;margin-top:0;overflow-wrap:anywhere}.clip video{width:100%;max-height:390px;display:block;background:#000;border-radius:10px;margin:10px 0}.clip a{display:block;padding:12px;margin-top:10px;text-align:center;color:#e4b75b;border:1px solid #5d4e32;border-radius:10px;text-decoration:none}.clip small{color:#b6b5c2}footer{font-size:12px;color:#9292a2;text-align:center;margin-top:26px}.steps{font-size:13px;color:#c5b791}details{margin-top:18px}summary{cursor:pointer;color:#c9b590}#network{font-size:12px;color:#b0a080}a{color:#e4b75b}[hidden]{display:none!important}@media(max-width:520px){.grid,.buttons{grid-template-columns:1fr}.panel{padding:18px}main{padding:18px 14px 35px}h1{margin-top:28px}.badge{font-size:10px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body><main>
<header><span class="brand" dir="ltr">CRIPS AI</span><span class="badge" data-t="badge"></span></header>
<h1 data-t="heading"></h1><p data-t="intro"></p><div id="network" role="status"></div>
<section class="panel"><form id="f">
<label for="key" data-t="key"></label><input id="key" type="password" autocomplete="off" required dir="ltr"><p class="hint" data-t="keyHint"></p>
<label for="url" data-t="url"></label><input id="url" type="url" required placeholder="https://youtu.be/..." autocomplete="url" dir="ltr" inputmode="url">
<div class="grid"><div><label for="count" data-t="count"></label><select id="count"></select></div><div><label for="duration" data-t="duration"></label><select id="duration" dir="ltr"><option value="30">15 - 30</option><option value="45">15 - 45</option><option value="60" selected>15 - 60</option></select></div></div>
<label for="style" data-t="style"></label><select id="style"><option value="minimal" data-t="minimal"></option><option value="bold" data-t="bold"></option><option value="boxed" data-t="boxed"></option><option value="none" data-t="none"></option></select>
<p class="hint" data-t="countHint"></p><button class="main-btn" id="go" type="submit" data-t="go"></button>
</form><div class="buttons"><button class="secondary" type="button" id="demo" data-t="demo"></button><button class="secondary" type="button" id="resume" data-t="resume" hidden></button></div>
<progress id="progress" value="0" max="100" hidden aria-label="Processing progress"></progress><div class="status" id="status" role="status" aria-live="polite"></div>
<details><summary data-t="limits"></summary><p class="hint" data-t="limitText"></p></details>
</section><div id="cards"></div>
<p class="notice" data-t="notice"></p><footer>Crips AI / FluxClip MIT - <span data-t="version"></span> 2026.11.16.2</footer>
</main>
<script>
'use strict';
const API='https://crips-ai-processing.onrender.com';
const T={
badge:'نسخة تجريبية • بدون API مدفوع',
heading:'من فيديو طويل إلى كليبات قصيرة',
intro:'رابط YouTube، اختيار تلقائي للقطات، وكابشن صغير في المنتصف. التحليل يعتمد على الكلام داخل الفيديو.',
key:'مفتاح الدخول',keyHint:'مفتاح Crips AI الخاص بك، وليس كلمة سر Google. لا نحفظه في المتصفح.',
url:'رابط YouTube',count:'عدد الكليبات',duration:'مدة الكليب (ثانية)',style:'شكل الكابشن',minimal:'بسيط وصغير',bold:'عريض',boxed:'مع خلفية',none:'بدون كابشن',
countHint:'قد يكون العدد الفعلي أقل إذا لم يكفِ المحتوى. نحافظ على صورة اللعبة كاملة داخل 9:16.',
go:'ابدأ صناعة الكليبات',demo:'فحص المحرك وفيديو التجربة',resume:'متابعة آخر طلب',
limits:'حدود النسخة المجانية',limitText:'معالجة فيديو واحد في كل مرة. قد تبطؤ المعالجة أو ينقطع الخادم. الملفات مؤقتة؛ نزّلها بعد انتهاء المعالجة. الكابشن التلقائي قد يخطئ ويحتاج مراجعة.',
notice:'فيديوهات YouTube المقيّدة بالعمر أو الخاصة غير مدعومة. قد يمنع YouTube استيراد روابط عامة أيضاً. استخدم محتوى لديك إذن بمعالجته.',
version:'إصدار',idle:'أدخل الرابط ومفتاحك للبدء.',starting:'جارٍ إرسال الطلب...',queued:'في الانتظار',downloading:'جلب الفيديو',transcribing:'تحويل الكلام إلى كابشن',analyzing:'اختيار اللقطات',rendering:'إنتاج الكليبات',processing:'جاري العمل',done:'اكتملت المعالجة',noClips:'انتهت المحاولة بدون كليبات صالحة للتنزيل.',preview:'معاينة وتنزيل MP4',save:'حفظ MP4',clip:'كليب',loading:'جارٍ جلب الملف...',online:'الخادم يستجيب',offline:'تعذّر فحص الخادم؛ ليس تأكيداً على جاهزية القص.',retry:'انقطع الاتصال مؤقتاً. نحاول متابعة نفس الطلب، بدون إنشاء طلب جديد.',demoRunning:'اختبار المحرك الداخلي لم ينتهِ بعد.',demoPassed:'نجح اختبار فيديو تجريبي مولّد، وليس فيديو YouTube.',demoFailed:'فشل اختبار المحرك؛ لا نعتبره جاهزاً حتى ينجح.'
};
const E={
ACCESS_KEY_REQUIRED:'مفتاح الدخول مفقود أو غير صحيح.',
INVALID_YOUTUBE_URL:'أدخل رابط فيديو YouTube صحيحاً.',
YOUTUBE_AGE_RESTRICTED:'هذا الفيديو مقيّد بالعمر. لا يمكن استيراده هنا. لم يبدأ قصّ الفيديو.',
YOUTUBE_VERIFICATION_REQUIRED:'يطلب YouTube تحققاً من السيرفر. الاستيراد متوقف؛ تغيير المفتاح لن يحل هذا القيد.',
YOUTUBE_RATE_LIMITED:'رفض YouTube الطلبات مؤقتاً بسبب حدّ الاستخدام. لا تكرر الطلب بسرعة.',
VIDEO_UNAVAILABLE:'الفيديو غير متاح للسيرفر.',SERVER_BUSY:'السيرفر يعالج فيديو آخر حالياً.',VIDEO_LIMIT_EXCEEDED:'تجاوز الفيديو حد الحجم أو المدة.',TRANSCRIPTION_FAILED:'تعذّر تشغيل تحويل الكلام.',PROCESSING_TIMEOUT:'تجاوزت المعالجة حد الوقت.',PROCESSING_FAILED:'فشلت المعالجة. لم يتم إنتاج كليب مؤكد.',NOT_FOUND:'الطلب أو الملف لم يعد متاحاً؛ قد يكون السيرفر أعيد تشغيله.',NETWORK:'تعذّر الاتصال بالسيرفر.',DOWNLOAD_FAILED:'تعذّر جلب ملف MP4.'};
for(const e of document.querySelectorAll('[data-t]'))e.textContent=T[e.dataset.t];
const $=s=>document.getElementById(s),state=$('status'),cards=$('cards'),go=$('go'),bar=$('progress');
for(let i=5;i<=15;i++){const o=new Option(String(i),String(i));o.selected=i===15;$('count').add(o)}
let current=null,timer=null,busy=false,checkMode=false,serial=0,failures=0;const blobs=[];const rendered=new Map();
function stored(){try{return JSON.parse(localStorage.getItem('crips.active')||'null')}catch{return null}}
function remember(id){try{localStorage.setItem('crips.active',JSON.stringify({id}))}catch{}$('resume').hidden=false}
function show(text,error=false){state.textContent=text;state.classList.toggle('error',error)}
function errorText(value){if(typeof value==='string'){for(const [key,text]of Object.entries(E))if(value.includes(key))return text;if(/age-restricted|confirm your age/i.test(value))return E.YOUTUBE_AGE_RESTRICTED;if(/not a bot/i.test(value))return E.YOUTUBE_VERIFICATION_REQUIRED;return value.slice(0,450)}if(Array.isArray(value))return value.map(errorText).join(' | ');if(value&&typeof value==='object')return errorText(value.msg||value.message||value.detail||'PROCESSING_FAILED');return E.PROCESSING_FAILED}
function accessKey(){const k=$('key').value.trim();if(!k)throw Error('ACCESS_KEY_REQUIRED');return k}
function setBusy(value){busy=value;go.disabled=value;$('demo').disabled=value;$('resume').disabled=value}
function clearResults(){serial++;clearTimeout(timer);for(const url of blobs)URL.revokeObjectURL(url);blobs.length=0;rendered.clear();cards.replaceChildren();bar.hidden=true}
async function request(path,opts={}){const token=accessKey();const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),90000);try{let r;try{r=await fetch(API+path,{...opts,headers:{'X-Access-Key':token,...(opts.headers||{})},signal:controller.signal})}catch{throw Error('NETWORK')}if(!r.ok){let d;try{d=await r.json()}catch{}const e=Error(d?errorText(d.detail||d.error||d):r.status===401?'ACCESS_KEY_REQUIRED':r.status===404?'NOT_FOUND':'HTTP '+r.status);e.http=r.status;throw e}return await r.json()}finally{clearTimeout(timeout)}}
function validateUrl(value){let u;try{u=new URL(value)}catch{throw Error('INVALID_YOUTUBE_URL')}if(u.protocol!=='https:'||u.username||u.password||u.port||!['youtube.com','www.youtube.com','m.youtube.com','youtu.be','www.youtu.be'].includes(u.hostname))throw Error('INVALID_YOUTUBE_URL');const parts=u.pathname.split('/').filter(Boolean);let id=u.hostname.endsWith('youtu.be')?parts[0]:u.pathname==='/watch'?u.searchParams.get('v'):['shorts','live','embed'].includes(parts[0])?parts[1]:'';if(!/^[A-Za-z0-9_-]{11}$/.test(id||''))throw Error('INVALID_YOUTUBE_URL');return 'https://www.youtube.com/watch?v='+id}
function filesafe(value){if(typeof value!=='string'||!value.startsWith('/files/'))throw Error('DOWNLOAD_FAILED');const u=new URL(value,API);if(u.origin!==new URL(API).origin||!u.pathname.startsWith('/files/'))throw Error('DOWNLOAD_FAILED');return u.href}
function showClips(project,epoch){for(const [i,c]of (project.clips||[]).entries()){if(c.status!=='ready'||!c.url||rendered.has(c.id))continue;const card=document.createElement('article');card.className='clip';const h=document.createElement('h3');h.textContent=c.title||T.clip+' '+(i+1);const info=document.createElement('small');info.textContent=(Number(c.duration)||Math.max(0,Number(c.end)-Number(c.start))).toFixed(1)+' s';const b=document.createElement('button');b.type='button';b.className='secondary';b.style.marginTop='14px';b.textContent=T.preview;card.append(h,info,b);cards.append(card);rendered.set(c.id,card);b.onclick=async()=>{b.disabled=true;b.textContent=T.loading;try{const r=await fetch(filesafe(c.url),{headers:{'X-Access-Key':accessKey()}});if(!r.ok)throw Error(r.status===401?'ACCESS_KEY_REQUIRED':'DOWNLOAD_FAILED');const blob=await r.blob();if(epoch!==serial)return;const signature=new Uint8Array(await blob.slice(0,64).arrayBuffer());if(!new TextDecoder().decode(signature).includes('ftyp'))throw Error('DOWNLOAD_FAILED');const href=URL.createObjectURL(blob);blobs.push(href);const video=document.createElement('video');video.controls=true;video.playsInline=true;video.preload='metadata';video.src=href;const a=document.createElement('a');a.href=href;a.download='crips-clip-'+(i+1)+'.mp4';a.textContent=T.save;card.append(video,a);b.remove()}catch(e){show(errorText(e.message),true);b.disabled=false;b.textContent=T.preview}}}}
async function watch(id,epoch){clearTimeout(timer);if(epoch!==serial)return;try{const p=await request('/api/projects/'+encodeURIComponent(id));if(epoch!==serial)return;failures=0;showClips(p,epoch);const frac=Number(p.progress);const pct=Number.isFinite(frac)?Math.round(Math.min(1,Math.max(0,frac))*100):0;bar.hidden=false;bar.value=pct;show((checkMode?T.demoPassed+'\n':'')+(T[p.stage]||T[p.status]||T.processing)+' - '+pct+'%');if(['failed','error','cancelled'].includes(p.status)){show(errorText(p.error||'PROCESSING_FAILED'),true);setBusy(false);return}if(['done','completed'].includes(p.status)){setBusy(false);if(!rendered.size)show(T.noClips,true);return}timer=setTimeout(()=>watch(id,epoch),4500)}catch(e){if(epoch!==serial)return;if(e.http===401||e.http===404||++failures>=3){show(errorText(e.http===404?'NOT_FOUND':e.message),true);setBusy(false);return}show(T.retry);timer=setTimeout(()=>watch(id,epoch),8000)}}
$('f').onsubmit=async e=>{e.preventDefault();if(busy)return;clearResults();checkMode=false;setBusy(true);show(T.starting);const epoch=serial;try{const source=validateUrl($('url').value.trim());const settings={num_clips:Number($('count').value),min_len:15,max_len:Number($('duration').value),caption_style:$('style').value};const p=await request('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source,settings})});if(!p.id)throw Error('PROCESSING_FAILED');current=p.id;remember(current);await watch(current,epoch)}catch(e){show(errorText(e.message),true);setBusy(false)}};
$('resume').onclick=()=>{const s=stored();if(!s||busy)return;clearResults();checkMode=false;setBusy(true);current=s.id;watch(current,serial)};
$('demo').onclick=async()=>{if(busy)return;clearResults();setBusy(true);try{const d=await request('/api/checks');if(d.state==='passed'&&d.project_id){checkMode=true;current=d.project_id;await watch(current,serial)}else{show(d.state==='failed'?T.demoFailed:T.demoRunning,d.state==='failed');setBusy(false)}}catch(e){show(errorText(e.message),true);setBusy(false)}};
$('resume').hidden=!stored();show(T.idle);
fetch(API+'/health').then(r=>r.ok?r.json():Promise.reject()).then(d=>{$('network').textContent=d.ok?T.online+' - '+(d.version||''):T.offline}).catch(()=>{$('network').textContent=T.offline});
</script></body></html>
